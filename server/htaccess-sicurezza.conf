# Sicurezza del sito (Apache). Da incollare in cima al .htaccess della root di WordPress,
# FUORI dai marcatori "# BEGIN WordPress" / "# END WordPress" (WordPress riscrive solo quella parte).
# Lo stesso file viene applicato dal server locale (dev/router.php): i test girano con questi header.
#
# In php.ini (o nel pannello dell'hosting) impostare anche:  expose_php = Off
# La CSP parte in Report-Only: segnala nella console del browser senza bloccare. Dopo una o due settimane
# senza segnalazioni, anche con i plugin attivi, rinominarla in Content-Security-Policy.
# HSTS senza includeSubDomains: aggiungerlo solo quando ogni sottodominio risponde in HTTPS.
# Solo ciò che manca sul live al 17/11/2026: X-Content-Type-Options, X-Frame-Options, Referrer-Policy e
# Permissions-Policy arrivano già dal server; ridefinirli qui con "always" li manderebbe due volte.

<IfModule mod_headers.c>
	Header always set Strict-Transport-Security "max-age=31536000"
	Header always unset X-Powered-By
	Header unset X-Powered-By
	# Solo sito pubblico: l'admin e il login usano script e worker che questa policy non prevede.
	<If "%{REQUEST_URI} !~ m#^/wp-(admin|login)#">
		Header always set Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; media-src 'self'; frame-src 'self' https://www.youtube-nocookie.com https://www.youtube.com https://player.vimeo.com https://www.google.com; connect-src 'self' https://*.google-analytics.com https://*.analytics.google.com https://www.googletagmanager.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; upgrade-insecure-requests"
	</If>
</IfModule>

# File di WordPress che rivelano la versione installata.
<FilesMatch "^(readme\.html|license\.txt)$">
	Require all denied
</FilesMatch>
